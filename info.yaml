# Tiny Tapeout project information
project:
  title:        "Camellia Crypto Engine"      # Project title
  author:       "Adrian Wu"      # Your name
  discord:      "dthusian"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A hardware implementation of the Camellia-128 block cipher"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dthusian_camellia"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_dthusian_camellia.sv"
    - "camellia_engine.sv"
    - "control.sv"
    - "sbox.sv"
    - "sigma_table.sv"
    - "data_reg.sv"
    - "key_reg.sv"
    - "ops.sv"
    - "cells/mux4.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "din[0]"
  ui[1]: "din[1]"
  ui[2]: "din[2]"
  ui[3]: "din[3]"
  ui[4]: "din[4]"
  ui[5]: "din[5]"
  ui[6]: "din[6]"
  ui[7]: "din[7]"

  # Outputs
  uo[0]: "dout[0]"
  uo[1]: "dout[1]"
  uo[2]: "dout[2]"
  uo[3]: "dout[3]"
  uo[4]: "dout[4]"
  uo[5]: "dout[5]"
  uo[6]: "dout[6]"
  uo[7]: "dout[7]"

  # Bidirectional pins
  uio[0]: "test_mode"
  uio[1]: "cmd_key"
  uio[2]: "cmd_data"
  uio[3]: "cmd_encrypt"
  uio[4]: "cmd_decrypt"
  uio[5]: "ready"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
